<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evaluación de la Alabanza — Administración</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
    .contenedor{width:min(800px,94%);margin:30px auto 60px}
    h1{font-size:34px;margin:0 0 6px}
    .subtitulo{color:#666;margin-top:0;margin-bottom:24px}
    .panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:24px;margin-bottom:22px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
    .titulo-seccion{font-size:24px;margin-top:0;border-bottom:1px solid #eee;padding-bottom:10px}

    label{display:block;font-weight:bold;font-size:15px;margin:14px 0 6px}
    input[type=date],input[type=url],textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;font-family:inherit}
    textarea{min-height:130px;resize:vertical}

    button.accion{border:0;border-radius:8px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}
    .btn-guardar{background:#198754;color:#fff}
    .btn-editar{background:#e8f0fb;color:#214e83;font-size:13px;padding:6px 10px;font-weight:normal}
    .btn-eliminar{background:#fde8e8;color:#b42318;font-size:13px;padding:6px 10px;font-weight:normal}
    .btn-cancelar{background:#eee;color:#333}

    .estado{display:none;margin-top:14px;padding:11px;border-radius:8px;white-space:pre-wrap}
    .exito{display:block;background:#e8f5e9;color:#2e7d32}
    .error{display:block;background:#ffebee;color:#c62828}

    #listaEvaluaciones{max-height:600px;overflow-y:auto;padding-right:6px}
    .eval-item{border:1px solid #e6e9ee;border-radius:10px;padding:14px 16px;margin-bottom:10px}
    .eval-item .fecha{font-weight:bold;color:#123a68;margin-bottom:6px}
    .eval-item .texto{font-size:14px;color:#333;white-space:pre-wrap;margin-bottom:8px}
    .eval-item .url{font-size:12.5px;color:#777;overflow-wrap:break-word;margin-bottom:8px}
    .eval-item .acciones{display:flex;gap:8px}

    .vacio{color:#8a95a5;text-align:center;padding:20px}

    .modal-fondo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
    .modal{width:min(560px,100%);background:#fff;border-radius:12px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
    .modal h3{margin-top:0;font-size:21px}
    .oculto{display:none!important}
  </style>
</head>
<body>
<div class="contenedor">
  <h1>🎤 Evaluación de la Alabanza — Administración</h1>
  <p class="subtitulo">Registra la evaluación dominical de los tiempos de alabanza.</p>

  <div class="panel">
    <h2 class="titulo-seccion">➕ Agregar evaluación</h2>

    <label for="fecha">Fecha</label>
    <input type="date" id="fecha">

    <label for="evaluacion">Evaluación</label>
    <textarea id="evaluacion" placeholder="Escribe aquí la evaluación completa..."></textarea>

    <label for="url">URL para escuchar (opcional)</label>
    <input type="url" id="url" placeholder="https://...">

    <div style="margin-top:16px">
      <button class="accion btn-guardar" id="btnGuardar" type="button" onclick="guardarEvaluacion()">💾 Guardar evaluación</button>
    </div>
    <div id="estadoGuardar" class="estado"></div>
  </div>

  <div class="panel">
    <h2 class="titulo-seccion">📋 Evaluaciones registradas</h2>
    <div id="listaEvaluaciones"><p class="vacio">Cargando...</p></div>
  </div>
</div>

<div id="modalEditarFondo" class="modal-fondo oculto" onclick="cerrarModalSiCorresponde(event)">
  <div class="modal">
    <h3>✏️ Editar evaluación</h3>
    <input type="hidden" id="editarFila">
    <label for="editarFecha">Fecha</label>
    <input type="date" id="editarFecha">
    <label for="editarEvaluacion">Evaluación</label>
    <textarea id="editarEvaluacion"></textarea>
    <label for="editarUrl">URL para escuchar</label>
    <input type="url" id="editarUrl">
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="accion btn-guardar" type="button" onclick="guardarEdicion()">💾 Guardar cambios</button>
      <button class="accion btn-cancelar" type="button" onclick="cerrarModal()">Cancelar</button>
    </div>
    <div id="estadoEditar" class="estado"></div>
  </div>
</div>

<script>
  function esc(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }

  function mostrarEstado(id, texto, tipo){
    const e = document.getElementById(id);
    e.textContent = texto;
    e.className = 'estado ' + tipo;
  }

  function guardarEvaluacion(){
    const datos = {
      fecha: document.getElementById('fecha').value,
      evaluacion: document.getElementById('evaluacion').value.trim(),
      url: document.getElementById('url').value.trim()
    };
    if (!datos.fecha) return mostrarEstado('estadoGuardar', 'La fecha es obligatoria.', 'error');
    if (!datos.evaluacion) return mostrarEstado('estadoGuardar', 'La evaluación es obligatoria.', 'error');

    const boton = document.getElementById('btnGuardar');
    boton.disabled = true;
    mostrarEstado('estadoGuardar', 'Guardando...', 'exito');

    google.script.run
      .withSuccessHandler(m => {
        boton.disabled = false;
        mostrarEstado('estadoGuardar', '✅ ' + m, 'exito');
        document.getElementById('fecha').value = '';
        document.getElementById('evaluacion').value = '';
        document.getElementById('url').value = '';
        cargarEvaluaciones();
      })
      .withFailureHandler(e => {
        boton.disabled = false;
        mostrarEstado('estadoGuardar', '❌ ' + (e.message||e), 'error');
      })
      .guardarEvaluacion(datos);
  }

  function cargarEvaluaciones(){
    const cont = document.getElementById('listaEvaluaciones');
    google.script.run
      .withSuccessHandler(lista => {
        if (!lista.length){ cont.innerHTML = '<p class="vacio">Todavía no hay evaluaciones registradas.</p>'; return; }

        const ordenadas = lista.slice().reverse(); // más reciente primero
        cont.innerHTML = ordenadas.map(e => `
          <div class="eval-item">
            <div class="fecha">📅 ${esc(e.fecha)}</div>
            <div class="texto">${esc(e.evaluacion)}</div>
            ${e.url ? `<div class="url">🎧 ${esc(e.url)}</div>` : ''}
            <div class="acciones">
              <button class="accion btn-editar" onclick='abrirEditar(${e.fila}, ${JSON.stringify(e.fecha)}, ${JSON.stringify(e.evaluacion)}, ${JSON.stringify(e.url)})'>✏️ Editar</button>
              <button class="accion btn-eliminar" onclick="eliminarEvaluacion(${e.fila})">🗑️ Eliminar</button>
            </div>
          </div>`).join('');
      })
      .withFailureHandler(e => { cont.innerHTML = '<p class="vacio">Error al cargar: ' + esc(e.message||e) + '</p>'; })
      .listarEvaluaciones();
  }

  function eliminarEvaluacion(fila){
    if (!confirm('¿Eliminar esta evaluación?')) return;
    google.script.run
      .withSuccessHandler(() => cargarEvaluaciones())
      .withFailureHandler(e => alert(e.message||e))
      .eliminarEvaluacion(fila);
  }

  function abrirEditar(fila, fecha, evaluacion, url){
    document.getElementById('editarFila').value = fila;
    document.getElementById('editarFecha').value = fecha;
    document.getElementById('editarEvaluacion').value = evaluacion;
    document.getElementById('editarUrl').value = url;
    document.getElementById('estadoEditar').className = 'estado';
    document.getElementById('modalEditarFondo').classList.remove('oculto');
  }

  function guardarEdicion(){
    const datos = {
      fila: document.getElementById('editarFila').value,
      fecha: document.getElementById('editarFecha').value,
      evaluacion: document.getElementById('editarEvaluacion').value.trim(),
      url: document.getElementById('editarUrl').value.trim()
    };
    if (!datos.fecha) return mostrarEstado('estadoEditar', 'La fecha es obligatoria.', 'error');
    if (!datos.evaluacion) return mostrarEstado('estadoEditar', 'La evaluación es obligatoria.', 'error');

    mostrarEstado('estadoEditar', 'Guardando...', 'exito');
    google.script.run
      .withSuccessHandler(m => {
        mostrarEstado('estadoEditar', '✅ ' + m, 'exito');
        setTimeout(() => { cerrarModal(); cargarEvaluaciones(); }, 500);
      })
      .withFailureHandler(e => mostrarEstado('estadoEditar', '❌ ' + (e.message||e), 'error'))
      .editarEvaluacion(datos);
  }

  function cerrarModal(){ document.getElementById('modalEditarFondo').classList.add('oculto'); }
  function cerrarModalSiCorresponde(ev){ if (ev.target === document.getElementById('modalEditarFondo')) cerrarModal(); }

  cargarEvaluaciones();
</script>
</body>
</html>
